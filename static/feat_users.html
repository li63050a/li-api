<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理</title>
<link rel="stylesheet" href="/common.css">
<script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>用户管理</h2>
    <div style="display:flex;gap:8px">
      <button class="btn btn-success" onclick="goAddUser()">新增用户</button>
      <button class="btn btn-warning" onclick="toggleBatch()">批量创建</button>
      <button class="btn btn-primary" onclick="loadUsers()">刷新</button>
    </div>
  </div>

  <div class="card" id="batchCard" style="display:none">
    <h3>批量创建用户</h3>
    <div class="form-group">
      <textarea id="bNames" rows="4" placeholder="每行一个用户名"></textarea>
      <input id="bPwd" type="password" placeholder="统一密码">
      <input id="bQuota" type="number" placeholder="额度(token, -1 不限)" value="-1">
      <button class="btn btn-success" onclick="batchCreate()">批量创建</button>
      <span id="batchMsg" class="msg"></span>
    </div>
  </div>

  <div class="card">
    <h3>用户列表</h3>
    <table>
      <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>已用/额度</th><th>操作</th></tr></thead>
      <tbody id="userTable"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-mask" id="userModal" style="display:none" onclick="if(event.target===this)closeUserModal()">
  <div class="modal">
    <h3>管理用户 <span id="mId" class="muted small"></span></h3>
    <div class="form-group"><label>用户名</label><input id="mName"></div>
    <div class="form-group"><label>密码</label><input id="mPwd" type="password" placeholder="留空则不修改"></div>
    <div class="form-group"><label>剩余额度</label><input id="mQuota" type="number" placeholder="-1 表示不限"></div>
    <div class="form-group"><label>身份</label>
      <select id="mRole"><option value="user">普通用户</option><option value="root">管理员</option></select>
    </div>
    <div class="form-group"><label>状态</label>
      <select id="mStatus"><option value="1">启用</option><option value="0">禁用</option></select>
    </div>
    <div class="form-group" style="justify-content:flex-end">
      <button class="btn btn-primary" onclick="saveUser()">保存</button>
      <button class="btn btn-warning" onclick="resetUser2FA()">关闭 2FA</button>
      <button class="btn btn-default" onclick="closeUserModal()">取消</button>
    </div>
    <p id="mMsg" class="msg" style="margin:8px 0 0"></p>
  </div>
</div>

<script>
function goAddUser(){
  var p = window.parent;
  try{
    if(p && p !== window && typeof p.nav === 'function'){
      p.nav('feat_user_add', '新增用户', p.document.querySelector('#menu .menu-item[data-page="feat_users"]'));
      return;
    }
  }catch(e){ /* 跨域忽略 */ }
  location.href = '/feat_user_add.html';
}

async function loadUsers(){ const res=await api('/admin/users'); if(!res.ok)return; const us=await res.json(); userList=us;
  document.getElementById('userTable').innerHTML=us.map(u=>`<tr><td>${u.id}</td><td>${escapeHtml(u.username)}</td><td>${u.role}</td>
    <td><span class="status ${u.status?'status-on':'status-off'}">${u.status?'启用':'禁用'}</span></td>
    <td>${escapeHtml(String(u.used))} / ${u.quota<0?'不限':escapeHtml(String(u.quota))}</td>
    <td><button class="btn btn-link" onclick="openManage(${u.id})">管理</button>
    <button class="btn btn-link" onclick="toggleUser(${u.id},${u.status?0:1})">${u.status?'禁用':'启用'}</button>
    <button class="btn btn-danger" onclick="deleteUser(${u.id})">删除</button></td></tr>`).join(''); }
async function deleteUser(id){ if(!confirm('确认删除该用户？'))return; await api('/admin/users/'+id,{method:'DELETE'}); loadUsers(); }
async function toggleUser(id,status){ await api('/admin/users/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status})}); loadUsers(); }

let editingUser=null;
let userList=[];

function openManage(id){
  const u = userList.find(function(x){ return x.id === id; });
  if(!u) return;
  editingUser=u;
  document.getElementById('mId').textContent='#'+u.id;
  document.getElementById('mName').value=u.username||'';
  document.getElementById('mPwd').value='';
  document.getElementById('mRole').value=(u.role==='root')?'root':'user';
  document.getElementById('mStatus').value=String(u.status===0?0:1);
  document.getElementById('mQuota').value= u.quota<0 ? -1 : (u.quota - (u.used||0));
  document.getElementById('mMsg').textContent='';
  document.getElementById('userModal').style.display='flex';
}

function closeUserModal(){
  document.getElementById('userModal').style.display='none';
  editingUser=null;
}

async function saveUser(){
  if(!editingUser) return;
  const msg=document.getElementById('mMsg');
  const data={
    username:document.getElementById('mName').value.trim(),
    role:document.getElementById('mRole').value,
    status:parseInt(document.getElementById('mStatus').value,10)
  };
  const pwd=document.getElementById('mPwd').value;
  if(pwd) data.password=pwd;
  const quota=parseInt(document.getElementById('mQuota').value,10);
  if(!isNaN(quota)){
    data.quota = quota<0 ? -1 : (quota + (editingUser.used||0));
  } else {
    data.quota = -1;
  }
  if(!data.username){ msg.textContent='用户名不能为空'; msg.style.color='var(--danger)'; return; }
  try{
    const res=await api('/admin/users/'+editingUser.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!res.ok){
      let t=''; try{ const d=await res.json(); t=d.error||d.message||''; }catch(e){}
      msg.textContent='保存失败：'+(t||res.status); msg.style.color='var(--danger)'; return;
    }
    msg.textContent='已保存'; msg.style.color='var(--success)';
    closeUserModal();
    loadUsers();
  }catch(e){
    msg.textContent='请求出错：'+(e.message||e); msg.style.color='var(--danger)';
  }
}

async function resetUser2FA(){
  if(!editingUser) return;
  const msg=document.getElementById('mMsg');
  if(!confirm('确认关闭用户 '+editingUser.username+' 的两步验证(2FA)？')) return;
  try{
    const res=await api('/admin/users/'+editingUser.id+'/2fa-reset',{method:'POST'});
    if(res.ok){
      msg.textContent='已关闭该用户的 2FA'; msg.style.color='var(--success)';
    }else{
      let t=''; try{ const d=await res.json(); t=d.error||d.message||''; }catch(e){}
      msg.textContent='关闭失败：'+(t||res.status); msg.style.color='var(--danger)';
    }
  }catch(e){
    msg.textContent='请求出错：'+(e.message||e); msg.style.color='var(--danger)';
  }
}

function toggleBatch(){
  const c=document.getElementById('batchCard');
  c.style.display=c.style.display==='none'?'':'none';
}
async function batchCreate(){
  const msg=document.getElementById('batchMsg');
  const names=document.getElementById('bNames').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const password=document.getElementById('bPwd').value;
  if(!names.length){ msg.textContent='请输入至少一个用户名'; msg.style.color='var(--danger)'; return; }
  if(!password){ msg.textContent='请填写统一密码'; msg.style.color='var(--danger)'; return; }
  msg.textContent='创建中…'; msg.style.color='var(--fg-2)';
  try{
    const res=await api('/admin/users/batch',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({usernames:names,password:password,quota:parseInt(document.getElementById('bQuota').value,10)||-1})});
    const d=await res.json().catch(()=>({}));
    if(!res.ok){ msg.textContent='创建失败：'+(d.error||d.message||res.status); msg.style.color='var(--danger)'; return; }
    const failed=d.failed||[];
    msg.innerHTML='创建成功 <b style="color:var(--success)">'+(d.created||0)+'</b> 个'+
      (failed.length?'，失败 <b style="color:var(--danger)">'+failed.length+'</b> 个：'+failed.map(f=>escapeHtml(f.username)+'('+escapeHtml(f.error)+')').join('；'):'');
    msg.style.color='var(--fg)';
    document.getElementById('bNames').value='';
    loadUsers();
  }catch(e){ msg.textContent='请求出错'; msg.style.color='var(--danger)'; }
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadUsers();
})();
</script>
</body>
</html>
