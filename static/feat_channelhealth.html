<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>渠道健康监控</title>
  <link rel="stylesheet" href="/common.css">
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="panel-head">
        <h2>渠道健康监控</h2>
        <div>
          <button class="btn btn-success" id="batchBtn" onclick="batchTest()">批量测试</button>
          <button class="btn" onclick="loadHealth()">刷新</button>
        </div>
      </div>
      <p class="muted">向每个渠道的 <code>/v1/models</code> 发起 3 秒超时探测，检测可达性与延迟。批量测试将 POST <code>/admin/channels/test/batch</code>。</p>

      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>名称</th>
            <th>分组</th>
            <th>状态</th>
            <th>HTTP 状态</th>
            <th>延迟(ms)</th>
            <th>错误</th>
          </tr>
        </thead>
        <tbody id="healthBody">
          <tr><td colspan="7" class="muted">加载中…</td></tr>
        </tbody>
      </table>

      <h3 style="margin-top:20px">批量测试结果</h3>
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>名称</th>
            <th>状态</th>
            <th>HTTP 状态</th>
            <th>延迟(ms)</th>
            <th>消息</th>
          </tr>
        </thead>
        <tbody id="batchBody">
          <tr><td colspan="6" class="muted">尚未执行批量测试</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    let healthIds = [];

    async function loadHealth() {
      const tb = $('healthBody');
      tb.innerHTML = '<tr><td colspan="7" class="muted">加载中…</td></tr>';
      try {
        const r = await api('/api/feat/channels/health');
        if (!r.ok) {
          tb.innerHTML = '<tr><td colspan="7" class="muted">获取失败（' + r.status + '）</td></tr>';
          return;
        }
        const data = await r.json();
        const list = data.channels || [];
        healthIds = list.map(c => c.id).filter(id => id != null);
        $('batchBtn').disabled = healthIds.length === 0;
        if (list.length === 0) {
          tb.innerHTML = '<tr><td colspan="7" class="muted">暂无渠道</td></tr>';
          return;
        }
        tb.innerHTML = list.map(c => {
          const on = c.status === '启用';
          const badge = '<span class="status-' + (on ? 'on' : 'off') + '">' + escapeHtml(c.status) + '</span>';
          const http = c.http_status ? String(c.http_status) : '—';
          const err = c.error ? escapeHtml(c.error) : '—';
          return `<tr>
            <td>${c.id}</td>
            <td>${escapeHtml(c.name)}</td>
            <td>${escapeHtml(c.group)}</td>
            <td>${badge}</td>
            <td>${http}</td>
            <td>${c.latency_ms != null ? c.latency_ms : '—'}</td>
            <td>${err}</td>
          </tr>`;
        }).join('');
      } catch (e) {
        tb.innerHTML = '<tr><td colspan="7" class="muted">请求错误</td></tr>';
      }
    }

    async function batchTest() {
      const body = $('batchBody');
      if (healthIds.length === 0) {
        body.innerHTML = '<tr><td colspan="6" class="msg">没有可测试的渠道 ID</td></tr>';
        return;
      }
      body.innerHTML = '<tr><td colspan="6" class="muted">批量测试中…</td></tr>';
      try {
        const r = await api('/admin/channels/test/batch', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ids: healthIds })
        });
        if (!r.ok) {
          body.innerHTML = '<tr><td colspan="6" class="msg">批量测试失败（' + r.status + '）</td></tr>';
          return;
        }
        const d = await r.json();
        let results = Array.isArray(d) ? d : (d.results || d.items || []);
        if (results.length === 0) {
          body.innerHTML = '<tr><td colspan="6" class="msg">批量测试未返回结果</td></tr>';
          return;
        }
        body.innerHTML = results.map(res => {
          const ok = res.success === true || res.ok === true;
          const badge = ok
            ? '<span class="status status-on">成功</span>'
            : '<span class="status status-off">失败</span>';
          const http = res.http_status != null ? String(res.http_status) : (res.status_code != null ? String(res.status_code) : '—');
          const lat = res.latency_ms != null ? res.latency_ms : '—';
          const msg = res.message || res.error || (ok ? 'OK' : '—');
          return `<tr>
            <td>${res.id != null ? escapeHtml(String(res.id)) : '-'}</td>
            <td>${escapeHtml(res.name || res.channel || '-')}</td>
            <td>${badge}</td>
            <td>${escapeHtml(http)}</td>
            <td>${escapeHtml(String(lat))}</td>
            <td>${escapeHtml(msg)}</td>
          </tr>`;
        }).join('');
      } catch (e) {
        body.innerHTML = '<tr><td colspan="6" class="msg">批量测试请求出错</td></tr>';
      }
    }

    (async () => {
      try { await ensureAuth(); } catch (e) { return; }
      await loadHealth();
    })();
  </script>
</body>
</html>
