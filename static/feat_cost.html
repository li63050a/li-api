<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>费用明细</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
  <style>
    .topbar h2 { margin: 0; }
    .muted { color: #718096; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; white-space: nowrap; }
    .badge-2xx { background: #c6f6d5; color: #22543d; }
    .badge-3xx { background: #bee3f8; color: #2c5282; }
    .badge-4xx { background: #feebc8; color: #7b341e; }
    .badge-5xx { background: #fed7d7; color: #9b2c2c; }
    .badge-other { background: #e2e8f0; color: #4a5568; }
    .btn[disabled] { opacity: .5; cursor: default; }
    .sum-row td { font-weight: 700; background: #f9fafc; color: #2d3748; }
    .path-cell { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>费用明细</h2>
    <button class="btn btn-primary" onclick="loadCosts()">刷新</button>
  </div>
  <p class="muted" id="costFoot" style="margin:4px 0 0"></p>
  <table>
    <thead>
      <tr><th>时间</th><th>模型</th><th>路径</th><th>令牌</th><th>状态码</th><th>消耗</th><th>耗时(ms)</th></tr>
    </thead>
    <tbody id="costBody">
      <tr><td colspan="7" class="muted">加载中…</td></tr>
    </tbody>
    <tfoot id="costFooter" style="display:none">
      <tr class="sum-row">
        <td colspan="5">本页合计</td>
        <td id="costTotal">0</td>
        <td id="costDur">—</td>
      </tr>
    </tfoot>
  </table>
  <div style="margin-top:10px" id="costPager"></div>
</div>

<script>
let costPage = 1;

function fmt(v) { return Number(v || 0).toLocaleString(); }

function statusBadge(s) {
  const n = parseInt(s, 10);
  let cls = 'badge-other';
  if (n >= 200 && n < 300) cls = 'badge-2xx';
  else if (n >= 300 && n < 400) cls = 'badge-3xx';
  else if (n >= 400 && n < 500) cls = 'badge-4xx';
  else if (n >= 500) cls = 'badge-5xx';
  return '<span class="badge ' + cls + '">' + escapeHtml(s) + '</span>';
}

async function loadCosts() {
  try { await ensureAuth(); } catch (e) { return; }
  const body = $('costBody');
  body.innerHTML = '<tr><td colspan="7" class="muted">加载中…</td></tr>';
  $('costFooter').style.display = 'none';
  $('costFoot').textContent = '';
  $('costPager').innerHTML = '';
  const qs = new URLSearchParams({ page: costPage, limit: 100 });
  let r, d;
  try {
    r = await api('/api/logs?' + qs.toString());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    d = await r.json();
  } catch (e) {
    body.innerHTML = '<tr><td colspan="7" class="muted">加载失败</td></tr>';
    return;
  }
  const logs = d.logs || [];
  const total = Number(d.total || 0);
  const limit = Number(d.limit || 100);
  const pages = Math.max(1, Math.ceil(total / limit));
  $('costFoot').textContent = '共 ' + fmt(total) + ' 条记录，第 ' + (d.page || costPage) + ' / ' + pages + ' 页';
  if (logs.length === 0) {
    body.innerHTML = '<tr><td colspan="7" class="muted">暂无记录</td></tr>';
    return;
  }
  let sumCost = 0, sumDur = 0;
  body.innerHTML = logs.map(l => {
    const cost = Number(l.cost || 0);
    const dur = Number(l.duration || 0);
    sumCost += cost;
    sumDur += dur;
    return '<tr>' +
      '<td style="white-space:nowrap">' + escapeHtml(fmtTime(l.time)) + '</td>' +
      '<td style="white-space:nowrap">' + escapeHtml(l.model || '-') + '</td>' +
      '<td class="path-cell" title="' + escapeHtml(l.path || '') + '">' + escapeHtml(l.path || '-') + '</td>' +
      '<td style="white-space:nowrap">' + escapeHtml(maskTok(l.token)) + '</td>' +
      '<td>' + statusBadge(l.status) + '</td>' +
      '<td style="white-space:nowrap">' + escapeHtml(l.cost || 0) + '</td>' +
      '<td style="white-space:nowrap">' + escapeHtml(l.duration || 0) + '</td>' +
      '</tr>';
  }).join('');
  $('costTotal').textContent = fmt(sumCost);
  $('costDur').textContent = fmt(sumDur);
  $('costFooter').style.display = '';
  $('costPager').innerHTML =
    '<button class="btn btn-dark" ' + (costPage <= 1 ? 'disabled ' : '') + 'onclick="costPage=Math.max(1,costPage-1);loadCosts()">上一页</button> ' +
    '<button class="btn btn-dark" ' + (costPage >= pages ? 'disabled ' : '') + 'onclick="costPage++;loadCosts()">下一页</button>';
}

loadCosts();
</script>
</body>
</html>
