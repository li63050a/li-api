<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渠道管理</title>
<link rel="stylesheet" href="/common.css">
<script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>渠道管理</h2>
    <div>
      <button class="btn btn-success" onclick="goAddChannel()">新增渠道</button>
      <button class="btn btn-primary" onclick="loadChannels()">刷新</button>
    </div>
  </div>

  <div id="groupOverview" style="margin:12px 0;color:var(--fg-2);font-size:13px"></div>

  <div class="card">
    <h3>渠道列表</h3>
    <div class="form-group" style="justify-content:flex-start">
      <label style="display:inline-flex;align-items:center;gap:4px"><input type="checkbox" id="checkAll" onclick="toggleAll()"> 全选</label>
      <select id="batchAction" style="flex:0 0 auto">
        <option value="enable">启用</option>
        <option value="disable">禁用</option>
        <option value="delete">删除</option>
      </select>
      <button class="btn btn-primary" onclick="applyBatch()">应用</button>
      <span id="batchMsg" class="msg"></span>
    </div>
    <table>
      <thead><tr><th style="width:36px"><input type="checkbox" id="checkAllHead" onclick="toggleAllHead()"></th><th>ID</th><th>名称</th><th>类型</th><th>基地址</th><th>模型</th><th>标签</th><th>分组</th><th>优先级</th><th>权重</th><th>状态</th><th>测试</th><th>操作</th></tr></thead>
      <tbody id="channelTable"><tr><td colspan="13" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
function renderTags(tags) {
  if (!tags) return '';
  return String(tags).split(',').map(function (t) {
    t = t.trim();
    return t ? '<span class="type-tag">' + escapeHtml(t) + '</span>' : '';
  }).filter(Boolean).join(' ');
}

async function loadChannels(){ const res=await api('/admin/channels'); if(!res.ok) return; const cs=await res.json();
  document.getElementById('channelTable').innerHTML = cs.map(c=>`<tr><td><input type="checkbox" class="chk" value="${c.id}"></td><td>${c.id}</td><td>${escapeHtml(c.name)}</td><td>${escapeHtml(c.type)}</td><td>${escapeHtml(c.base_url)}</td>
    <td>${escapeHtml(c.models)}</td><td>${renderTags(c.tags)}</td><td>${escapeHtml(c.group)}</td><td>${c.priority}</td><td>${c.weight}</td>
    <td><span class="status ${c.status?'status-on':'status-off'}">${c.status?'启用':'禁用'}</span></td>
    <td><button class="btn btn-link" onclick="testChannel(${c.id})">测试</button></td>
    <td><button class="btn btn-danger" onclick="deleteChannel(${c.id})">删除</button></td></tr>`).join('');
  const groups={};
  cs.forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  const keys=Object.keys(groups);
  document.getElementById('groupOverview').innerHTML = keys.length
    ? '分组概览：'+keys.map(g=>`<b>${escapeHtml(g)}</b> [`+groups[g].map(c=>`${escapeHtml(c.name)}(w${c.weight},p${c.priority})`).join('、')+`]`).join('　')
    : ''; }
async function testChannel(id){ try{ const res=await api('/admin/channels/test/'+id,{method:'POST'}); const d=await res.json();
  alert('状态码: '+d.status+'\n结果: '+(d.success?'成功 ✓':'失败 ✗')+'\n'+(d.message||'')); }
  catch(e){ alert('测试请求出错: '+e); } }
function goAddChannel(){
  var p = window.parent;
  try{
    if(p && p !== window && typeof p.nav === 'function'){
      p.nav('feat_channel_add', '新增渠道', p.document.querySelector('#menu .menu-item[data-page="feat_channels"]'));
      return;
    }
  }catch(e){ /* 跨域忽略 */ }
  location.href = '/feat_channel_add.html';
}
async function deleteChannel(id){ if(!confirm('确认删除？'))return; await api('/admin/channels/'+id,{method:'DELETE'}); loadChannels(); }

function toggleAll(){
  const all = document.getElementById('checkAll').checked;
  document.querySelectorAll('.chk').forEach(function(c){ c.checked = all; });
}
function toggleAllHead(){
  const all = document.getElementById('checkAllHead').checked;
  document.getElementById('checkAll').checked = all;
  document.querySelectorAll('.chk').forEach(function(c){ c.checked = all; });
}
function checkedIds(){
  return Array.prototype.map.call(document.querySelectorAll('.chk:checked'), function(c){ return parseInt(c.value,10); })
    .filter(function(n){ return !isNaN(n); });
}
async function applyBatch(){
  const ids = checkedIds();
  const action = v('batchAction');
  const label = {enable:'启用',disable:'禁用',delete:'删除'}[action] || action;
  const m = document.getElementById('batchMsg');
  if(!ids.length){ m.textContent='请先勾选渠道'; m.style.color='var(--danger)'; return; }
  if(action==='delete' && !confirm('确认删除 '+ids.length+' 个渠道？')) return;
  try{
    const res = await api('/admin/channels/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:ids, action:action})});
    if(!res.ok){ m.textContent='批量'+label+'失败：'+res.status; m.style.color='var(--danger)'; return; }
    let d={}; try{ d=await res.json(); }catch(e){ /* 空响应 */ }
    m.textContent='已执行批量'+label+(d && d.affected!=null ? '（'+d.affected+' 个）' : '')+(d && d.message ? '：'+d.message : '');
    m.style.color='var(--success)';
    loadChannels();
  }catch(e){ m.textContent='批量'+label+'出错：'+e; m.style.color='var(--danger)'; }
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadChannels();
})();
</script>
</body>
</html>
