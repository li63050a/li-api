<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发票管理</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>发票管理</h2>
    <button class="btn btn-primary" onclick="loadInvoices()">刷新</button>
  </div>

  <div class="card">
    <h3>生成发票</h3>
    <div class="form-group">
      <input id="invMonth" placeholder="月份 YYYY-MM，如 2026-08">
      <input id="invNote" placeholder="备注 note">
      <button class="btn btn-success" onclick="createInvoice()">创建</button>
      <span id="msg" class="msg"></span>
    </div>
  </div>

  <table>
    <thead><tr><th>月份</th><th>备注</th><th>请求数</th><th>成本</th><th>创建时间</th><th>操作</th></tr></thead>
    <tbody id="invBody"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
  </table>
</div>

<script>
async function loadInvoices() {
  const body = $('invBody');
  body.innerHTML = '<tr><td colspan="6" class="muted">加载中…</td></tr>';
  let list = [];
  try {
    const r = await api('/api/billing/invoices');
    if (!r.ok) { body.innerHTML = '<tr><td colspan="6" class="msg">获取失败（' + r.status + '）</td></tr>'; return; }
    const d = await r.json();
    list = Array.isArray(d) ? d : (d.invoices || []);
  } catch (e) { body.innerHTML = '<tr><td colspan="6" class="msg">获取失败</td></tr>'; return; }
  if (list.length === 0) { body.innerHTML = '<tr><td colspan="6" class="muted">暂无发票</td></tr>'; return; }
  body.innerHTML = list.map((inv, i) => `<tr>
    <td>${escapeHtml(inv.month || inv.month_key || '-')}</td>
    <td>${escapeHtml(inv.note || inv.remark || '-')}</td>
    <td>${inv.requests == null ? '-' : escapeHtml(String(inv.requests))}</td>
    <td>${inv.cost == null ? '-' : escapeHtml(String(inv.cost))}</td>
    <td>${escapeHtml(fmtTime(inv.created_at || inv.createdAt))}</td>
    <td>
      <a class="btn btn-dark" href="/api/billing/invoices/download?month=${encodeURIComponent(inv.month || inv.month_key || '')}">下载</a>
      <button class="btn btn-danger" onclick="deleteInvoice('${escapeHtml(inv.month || inv.month_key || '')}')">删除</button>
    </td>
  </tr>`).join('');
}

async function createInvoice() {
  const msg = $('msg');
  msg.textContent = '';
  const month = v('invMonth').trim();
  if (!month) { msg.textContent = '请填写月份'; return; }
  const data = { month: month };
  const note = v('invNote').trim();
  if (note) data.note = note;
  try {
    const r = await api('/api/billing/invoices', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { msg.textContent = '创建失败：' + (d.error || d.message || r.status); return; }
    msg.style.color = '#38a169';
    msg.textContent = '已创建发票 ' + month;
    $('invMonth').value = '';
    $('invNote').value = '';
    loadInvoices();
  } catch (e) { msg.textContent = '创建失败'; }
}

async function deleteInvoice(month) {
  if (!month) return;
  if (!confirm('确认删除 ' + month + ' 的发票？')) return;
  try {
    const r = await api('/api/billing/invoices?month=' + encodeURIComponent(month), { method: 'DELETE' });
    if (!r.ok) { alert('删除失败：' + r.status); return; }
    loadInvoices();
  } catch (e) { alert('删除失败'); }
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadInvoices();
})();
</script>
</body>
</html>
