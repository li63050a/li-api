<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>兑换码</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>兑换码</h2>
    <div>
      <button class="btn btn-primary" onclick="loadRedemptions()">刷新</button>
    </div>
  </div>

  <div class="card">
    <h3>兑换充值码</h3>
    <div class="form-group">
      <input id="redeemCode" placeholder="输入兑换码">
      <button class="btn btn-success" onclick="redeem()">兑换</button>
    </div>
    <p id="redeemMsg" class="msg"></p>
  </div>

  <div class="card" id="genBox" style="display:none">
    <h3>生成兑换码</h3>
    <div class="form-group">
      <input id="genQuota" type="number" placeholder="单码额度 quota" value="100000">
      <input id="genCount" type="number" placeholder="数量 count" value="1">
      <button class="btn btn-primary" onclick="generate()">生成</button>
    </div>
    <p id="genMsg" class="msg"></p>
    <div id="genResult"></div>
  </div>

  <div class="card">
    <h3>兑换码列表</h3>
    <table>
      <thead>
        <tr><th>兑换码</th><th>额度</th><th>状态</th><th>创建者</th><th>创建时间</th><th>兑换者</th><th>兑换时间</th></tr>
      </thead>
      <tbody id="body"><tr><td colspan="7" class="muted">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
async function loadRedemptions() {
  const body = $('body');
  body.innerHTML = '<tr><td colspan="7" class="muted">加载中…</td></tr>';
  try {
    const r = await api('/admin/redemptions');
    if (!r.ok) {
      body.innerHTML = '<tr><td colspan="7" class="muted">获取失败（' + r.status + '）</td></tr>';
      return;
    }
    const list = await r.json();
    if (list.length === 0) {
      body.innerHTML = '<tr><td colspan="7" class="muted">暂无兑换码</td></tr>';
      return;
    }
    body.innerHTML = list.map(x => `
      <tr>
        <td><code>${escapeHtml(x.code)}</code></td>
        <td>${Number(x.quota || 0).toLocaleString()}</td>
        <td>${x.status === 1 ? '<span class="status status-on">未使用</span>' : '<span class="status status-off">已使用</span>'}</td>
        <td>${escapeHtml(x.created_by)}</td>
        <td>${escapeHtml(fmtTime(x.created_at))}</td>
        <td>${escapeHtml(x.redeemed_by)}</td>
        <td>${escapeHtml(fmtTime(x.redeemed_at))}</td>
      </tr>`).join('');
  } catch (e) {
    body.innerHTML = '<tr><td colspan="7" class="muted">获取失败</td></tr>';
  }
}

async function redeem() {
  const msg = $('redeemMsg');
  const code = v('redeemCode').trim();
  if (!code) { msg.textContent = '请输入兑换码'; return; }
  msg.textContent = '兑换中…';
  msg.style.color = 'var(--fg-2)';
  try {
    const r = await api('/api/redemption/redeem', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.success) {
      msg.textContent = d.message || '兑换成功，额度已增加';
      msg.style.color = 'var(--success)';
      $('redeemCode').value = '';
      await loadRedemptions();
    } else {
      msg.textContent = '兑换失败：' + (d.error || d.message || ('HTTP ' + r.status));
      msg.style.color = 'var(--danger)';
    }
  } catch (e) {
    msg.textContent = '兑换失败';
    msg.style.color = 'var(--danger)';
  }
}

async function generate() {
  const msg = $('genMsg');
  const quota = parseInt(v('genQuota'), 10);
  const count = parseInt(v('genCount'), 10);
  if (!quota || quota <= 0) { msg.textContent = '请填写正数额度'; return; }
  if (!count || count <= 0) { msg.textContent = '请填写正数数量'; return; }
  msg.textContent = '生成中…';
  msg.style.color = 'var(--fg-2)';
  try {
    const r = await api('/admin/redemptions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ quota: quota, count: count })
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.codes) {
      msg.textContent = '已生成 ' + d.codes.length + ' 个兑换码';
      msg.style.color = 'var(--success)';
      $('genResult').innerHTML = '<h3>新兑换码</h3><div>' + d.codes.map(c => '<span class="rec-code">' + escapeHtml(c) + '</span>').join('') + '</div>';
      await loadRedemptions();
    } else {
      msg.textContent = '生成失败：' + (d.error || d.message || ('HTTP ' + r.status));
      msg.style.color = 'var(--danger)';
    }
  } catch (e) {
    msg.textContent = '生成失败';
    msg.style.color = 'var(--danger)';
  }
}

(async () => {
  try {
    const me = await ensureAuth();
    if (me && me.role === 'root') {
      $('genBox').style.display = '';
    }
  } catch (e) { return; }
  await loadRedemptions();
})();
</script>
</body>
</html>
