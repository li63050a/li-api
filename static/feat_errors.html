<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错误日志</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>错误日志</h2>
    <div>
      <button class="btn btn-primary" onclick="loadErrors()">刷新</button>
    </div>
  </div>

  <div class="form-group">
    <input id="fModel" placeholder="模型 model" style="flex:1 1 140px">
    <input id="fLimit" type="number" placeholder="每页 limit" value="100" min="1" max="500" style="flex:1 1 90px">
    <button class="btn btn-primary" onclick="doSearch()">查询</button>
  </div>

  <table>
    <thead>
      <tr><th>时间</th><th>模型</th><th>路径</th><th>状态</th><th>成本</th><th>耗时(ms)</th></tr>
    </thead>
    <tbody id="body"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
  </table>
</div>

<script>
let page = 1;

function doSearch() { page = 1; loadErrors(); }

function statusBadge(s) {
  const n = parseInt(s, 10);
  let cls = 'badge-other';
  if (n >= 400 && n < 500) cls = 'badge-4xx';
  else if (n >= 500) cls = 'badge-5xx';
  return '<span class="status ' + cls + '">' + escapeHtml(s) + '</span>';
}

async function loadErrors() {
  const body = $('body');
  body.innerHTML = '<tr><td colspan="6" class="muted">加载中…</td></tr>';
  const limit = Math.min(500, Math.max(1, parseInt(v('fLimit'), 10) || 100));
  const qs = new URLSearchParams({ page: page, limit: limit });
  const m = v('fModel').trim();
  if (m) qs.set('model', m);
  let d = {};
  try {
    const r = await api('/api/logs?' + qs.toString());
    if (!r.ok) {
      body.innerHTML = '<tr><td colspan="6" class="msg">获取失败（' + r.status + '）</td></tr>';
      return;
    }
    d = await r.json();
  } catch (e) {
    body.innerHTML = '<tr><td colspan="6" class="msg">获取失败</td></tr>';
    return;
  }
  const logs = (d.logs || []).filter(l => parseInt(l.status, 10) >= 400);
  if (logs.length === 0) {
    body.innerHTML = '<tr><td colspan="6" class="muted">暂无错误日志（status ≥ 400）</td></tr>';
    return;
  }
  body.innerHTML = logs.map(l => `
    <tr>
      <td style="white-space:nowrap">${escapeHtml(fmtTime(l.time))}</td>
      <td style="white-space:nowrap">${escapeHtml(l.model || '-')}</td>
      <td style="max-width:240px;word-break:break-all">${escapeHtml(l.path || '')}</td>
      <td>${statusBadge(l.status)}</td>
      <td style="white-space:nowrap">${escapeHtml(l.cost || 0)}</td>
      <td style="white-space:nowrap">${escapeHtml(l.duration || 0)}</td>
    </tr>`).join('');
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadErrors();
})();
</script>
</body>
</html>
