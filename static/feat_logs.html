<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>请求日志</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
  <style>
    .muted { color: #718096; }
    .small { font-size: 12px; color: #718096; }
    .row-click { cursor: pointer; }
    .row-click:hover td { background: #f7fafc; }
    .preview { font-family: monospace; font-size: 12px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>请求日志</h2>
    <div>
      <button class="btn btn-primary" onclick="loadLogs()">刷新</button>
      <span id="pager" style="margin-left:10px"></span>
    </div>
  </div>

  <table>
    <thead><tr><th>时间</th><th>方法</th><th>路径</th><th>模型</th><th>令牌</th><th>状态</th><th>成本</th><th>耗时(ms)</th></tr></thead>
    <tbody id="logBody"><tr><td colspan="8" class="muted">加载中…</td></tr></tbody>
  </table>
</div>

<script>
let logPage = 1;

function statusBadge(s) {
  const n = parseInt(s, 10);
  let bg = '#e2e8f0', fg = '#4a5568';
  if (n >= 200 && n < 300) { bg = '#c6f6d5'; fg = '#22543d'; }
  else if (n >= 300 && n < 400) { bg = '#bee3f8'; fg = '#2c5282'; }
  else if (n >= 400 && n < 500) { bg = '#feebc8'; fg = '#7b341e'; }
  else if (n >= 500) { bg = '#fed7d7'; fg = '#9b2c2c'; }
  return '<span class="status" style="background:' + bg + ';color:' + fg + '">' + escapeHtml(s) + '</span>';
}

function pretty(text) {
  if (text == null) return '';
  const s = String(text);
  try { return JSON.stringify(JSON.parse(s), null, 2); }
  catch (e) { return s; }
}

async function loadLogs() {
  const body = $('logBody');
  body.innerHTML = '<tr><td colspan="8" class="muted">加载中…</td></tr>';
  const qs = new URLSearchParams({ page: logPage, limit: 50 });
  let d = {};
  try {
    const r = await api('/api/logs?' + qs.toString());
    if (!r.ok) { body.innerHTML = '<tr><td colspan="8" class="msg">获取失败（' + r.status + '）</td></tr>'; return; }
    d = await r.json();
  } catch (e) { body.innerHTML = '<tr><td colspan="8" class="msg">获取失败</td></tr>'; return; }
  const logs = d.logs || [];
  if (logs.length === 0) {
    body.innerHTML = '<tr><td colspan="8" class="muted">暂无日志</td></tr>';
  } else {
    body.innerHTML = logs.map((l, i) => `
      <tr class="row-click" onclick="toggleDetail(${i})">
        <td style="white-space:nowrap">${escapeHtml(fmtTime(l.time))}</td>
        <td>${escapeHtml(l.method || '')}</td>
        <td style="max-width:220px;word-break:break-all">${escapeHtml(l.path || '')}</td>
        <td>${escapeHtml(l.model || '')}</td>
        <td><code>${escapeHtml(maskTok(l.token))}</code></td>
        <td>${statusBadge(l.status)}</td>
        <td>${escapeHtml(String(l.cost || 0))}</td>
        <td>${escapeHtml(String(l.duration || 0))}</td>
      </tr>
      <tr id="det${i}" style="display:none"><td colspan="8" style="background:#f9fafc">
        <div class="small">请求预览</div>
        <div class="preview">${escapeHtml(pretty(l.req_preview))}</div>
        <div class="small" style="margin-top:8px">响应预览</div>
        <div class="preview">${escapeHtml(pretty(l.resp_preview))}</div>
      </td></tr>`).join('');
  }
  const pages = Math.max(1, Math.ceil((d.total || 0) / (d.limit || 50)));
  $('pager').innerHTML = '第' + (d.page || 1) + '/' + pages + '页 共' + (d.total || 0) + '条 ' +
    '<button class="btn btn-dark" onclick="logPage=Math.max(1,logPage-1);loadLogs()">上一页</button> ' +
    '<button class="btn btn-dark" onclick="logPage=Math.min(' + pages + ',logPage+1);loadLogs()">下一页</button>';
}

function toggleDetail(i) {
  const el = $('det' + i);
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadLogs();
})();
</script>
</body>
</html>
