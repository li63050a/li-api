<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>请求日志</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
  <style>
    .row-click:hover td { background: var(--row-hover); }
  </style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>请求日志</h2>
    <div>
      <button class="btn btn-primary" onclick="loadLogs()">刷新</button>
      <span id="pager" style="margin-left:10px"></span>
    </div>
  </div>

  <div class="form-group">
    <input id="fModel" placeholder="模型 model" style="flex:1 1 140px">
    <input id="fStatus" placeholder="状态码 status" style="flex:1 1 100px">
    <input id="fGroup" placeholder="分组 group" style="flex:1 1 120px">
    <input id="fLimit" type="number" placeholder="每页 limit" value="50" min="1" max="500" style="flex:1 1 90px">
    <button class="btn btn-primary" onclick="doSearch()">查询</button>
  </div>

  <table>
    <thead><tr><th>时间</th><th>方法</th><th>路径</th><th>模型</th><th>分组</th><th>令牌</th><th>状态</th><th>成本</th><th>耗时(ms)</th></tr></thead>
    <tbody id="logBody"><tr><td colspan="9" class="muted">加载中…</td></tr></tbody>
  </table>
</div>

<script>
let logPage = 1;

function doSearch() { logPage = 1; loadLogs(); }

function statusBadge(s) {
  const n = parseInt(s, 10);
  let cls = 'badge-other';
  if (n >= 200 && n < 300) cls = 'status-on';
  else if (n >= 300 && n < 400) cls = 'badge-3xx';
  else if (n >= 400 && n < 500) cls = 'badge-4xx';
  else if (n >= 500) cls = 'badge-5xx';
  return '<span class="status ' + cls + '">' + escapeHtml(s) + '</span>';
}

function pretty(text) {
  if (text == null) return '';
  const s = String(text);
  try { return JSON.stringify(JSON.parse(s), null, 2); }
  catch (e) { return s; }
}

async function loadLogs() {
  const body = $('logBody');
  loadState(body, '加载中…');
  $('pager').innerHTML = '';
  const limit = Math.min(500, Math.max(1, parseInt(v('fLimit'), 10) || 50));
  const qs = new URLSearchParams({ page: logPage, limit: limit });
  const m = v('fModel').trim();
  if (m) qs.set('model', m);
  const st = v('fStatus').trim();
  if (st) qs.set('status', st);
  const g = v('fGroup').trim();
  if (g) qs.set('group', g);
  let d = {};
  try {
    const r = await apiWithTimeout('/api/logs?' + qs.toString());
    if (!r.ok) { emptyState(body, '获取失败'); return; }
    d = await r.json();
  } catch (e) { emptyState(body, '获取失败'); return; }
  const logs = d.logs || [];
  if (logs.length === 0) {
    emptyState(body, '暂无日志');
  } else {
    body.innerHTML = logs.map((l, i) => `
      <tr class="row-click" onclick="toggleDetail(${i})">
        <td style="white-space:nowrap">${escapeHtml(fmtTime(l.time))}</td>
        <td>${escapeHtml(l.method || '')}</td>
        <td style="max-width:220px;word-break:break-all">${escapeHtml(l.path || '')}</td>
        <td>${escapeHtml(l.model || '')}</td>
        <td>${escapeHtml(l.group || '')}</td>
        <td><code>${escapeHtml(maskTok(l.token))}</code></td>
        <td>${statusBadge(l.status)}</td>
        <td>${escapeHtml(String(l.cost || 0))}</td>
        <td>${escapeHtml(String(l.duration || 0))}</td>
      </tr>
      <tr id="det${i}" style="display:none"><td colspan="9" style="background:var(--th-bg)">
        <div class="small">请求预览</div>
        <div class="preview">${escapeHtml(pretty(l.req_preview))}</div>
        <div class="small" style="margin-top:8px">响应预览</div>
        <div class="preview">${escapeHtml(pretty(l.resp_preview))}</div>
      </td></tr>`).join('');
  }
  const pages = Math.max(1, Math.ceil((d.total || 0) / (d.limit || limit)));
  $('pager').innerHTML = '第' + (d.page || 1) + '/' + pages + '页 共' + (d.total || 0) + '条 ' +
    '<button class="btn btn-dark" onclick="logPage=Math.max(1,logPage-1);loadLogs()">上一页</button> ' +
    '<button class="btn btn-dark" onclick="logPage=Math.min(' + pages + ',logPage+1);loadLogs()">下一页</button>';
}

function toggleDetail(i) {
  const el = $('det' + i);
  el.style.display = el.style.display === 'none' ? '' : 'none';
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadLogs();
})();
</script>
</body>
</html>
