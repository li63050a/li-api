<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统信息</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>系统信息</h2>
    <div>
      <button class="btn btn-primary" onclick="loadAll()">刷新</button>
    </div>
  </div>

  <div class="stat-cards">
    <div class="stat-card"><div class="stat-title">状态</div><div class="stat-value" id="siStatus">—</div></div>
    <div class="stat-card"><div class="stat-title">版本</div><div class="stat-value" id="siVersion">—</div></div>
    <div class="stat-card"><div class="stat-title">请求总数</div><div class="stat-value" id="siTotalReq">—</div></div>
    <div class="stat-card"><div class="stat-title">今日请求</div><div class="stat-value" id="siTodayReq">—</div></div>
    <div class="stat-card"><div class="stat-title">收入</div><div class="stat-value" id="siRevenue">—</div></div>
    <div class="stat-card"><div class="stat-title">活跃用户</div><div class="stat-value" id="siActive">—</div></div>
    <div class="stat-card"><div class="stat-title">新用户</div><div class="stat-value" id="siNew">—</div></div>
    <div class="stat-card"><div class="stat-title">Goroutines</div><div class="stat-value" id="siGor">—</div></div>
  </div>

  <div class="card">
    <h3>健康检查 /healthz</h3>
    <pre class="preview" id="healthBody">加载中…</pre>
  </div>

  <div class="card">
    <h3>性能监控</h3>
    <div class="stat-cards">
      <div class="stat-card"><div class="stat-title">CPU 负载</div><div class="stat-value" id="pfCpu">—</div></div>
      <div class="stat-card"><div class="stat-title">内存使用</div><div id="pfMem" class="stat-value" style="font-size:13px;line-height:1.7">—</div></div>
      <div class="stat-card"><div class="stat-title">Goroutines</div><div class="stat-value" id="pfGor">—</div></div>
    </div>
    <h3>告警配置</h3>
    <div class="form-group">
      <label><input type="checkbox" id="perfEnabled"> 启用</label>
      <span class="hint" style="margin:0">CPU 负载或内存使用率超阈值时触发告警</span>
    </div>
    <div class="form-group">
      <input id="perfMaxLoad" type="number" step="0.1" placeholder="CPU 负载阈值 max_load">
      <input id="perfMaxMem" type="number" step="1" placeholder="内存使用率阈值 % max_mem_pct">
      <button class="btn btn-primary" onclick="savePerf()">保存</button>
      <span id="perfMsg" class="msg"></span>
    </div>
  </div>
</div>

<script>
async function loadHealth() {
  const el = $('healthBody');
  try {
    const r = await fetch('/healthz');
    const t = await r.text();
    el.textContent = t || ('HTTP ' + r.status);
    $('siStatus').textContent = r.ok ? '正常' : '异常';
  } catch (e) {
    el.textContent = 'healthz 请求失败：' + e;
    $('siStatus').textContent = '异常';
  }
}

async function loadMetrics() {
  try {
    const r = await fetch('/metrics');
    const t = await r.text();
    const m = t.match(/^go_goroutines\s+(\d+)/m);
    $('siGor').textContent = m ? m[1] : '—';
  } catch (e) {
    $('siGor').textContent = '—';
  }
}

async function loadStats() {
  try {
    const r = await api('/api/stats');
    if (!r.ok) return;
    const d = await r.json();
    $('siTotalReq').textContent = Number(d.total_requests || 0).toLocaleString();
    $('siTodayReq').textContent = Number(d.today_requests || 0).toLocaleString();
    const ops = d.ops || {};
    $('siRevenue').textContent = Number(ops.revenue || 0).toLocaleString();
    $('siActive').textContent = ops.active_users != null ? Number(ops.active_users).toLocaleString() : '—';
    $('siNew').textContent = ops.new_users != null ? Number(ops.new_users).toLocaleString() : '—';
  } catch (e) { /* ignore */ }
}

function loadAll() {
  loadHealth();
  loadMetrics();
  loadStats();
  loadPerf();
  loadPerfConfig();
}

async function loadPerf() {
  try {
    const r = await api('/api/ops/perf');
    if (!r.ok) {
      $('pfCpu').textContent = 'N/A';
      $('pfMem').textContent = 'N/A';
      $('pfGor').textContent = 'N/A';
      $('siVersion').textContent = 'unknown';
      return;
    }
    const d = await r.json();
    $('siVersion').textContent = d.version != null && d.version !== '' ? d.version : 'unknown';
    $('pfCpu').textContent = d.cpu_load != null ? d.cpu_load
      : (d.cpu != null ? d.cpu : (d.load != null ? d.load : '—'));
    $('pfGor').textContent = d.goroutines != null ? d.goroutines
      : (d.goroutine != null ? d.goroutine : '—');

    const memTotal = Number(d.mem_total_mb) || 0;
    const memUsed = d.mem_used_mb != null ? Number(d.mem_used_mb) : null;
    const memPct = d.mem_used_pct != null ? Number(d.mem_used_pct) : null;
    const el = $('pfMem');
    if (memTotal <= 0) {
      el.innerHTML = '<div style="font-size:14px;line-height:1.6">无法读取(需Linux)</div>';
      return;
    }
    const usedMB = memUsed != null ? Math.round(memUsed) : Math.round(memTotal * (memPct != null ? memPct : 0) / 100);
    const pct = memPct != null ? Math.round(memPct) : (memUsed != null ? Math.round(memUsed / memTotal * 100) : 0);
    el.innerHTML =
      '<div>内存 ' + usedMB + 'MB / ' + Math.round(memTotal) + 'MB (' + pct + '%)</div>' +
      '<div class="ubar" style="margin-top:6px"><div class="ubar-fill" style="width:' + Math.min(100, Math.max(0, pct)) + '%"></div></div>';
  } catch (e) { /* ignore */ }
}

async function loadPerfConfig() {
  try {
    const r = await api('/api/setting/perf');
    if (!r.ok) return;
    const d = await r.json();
    const c = d.perf || d.settings || d;
    $('perfEnabled').checked = !!c.enabled;
    if (c.max_load != null) $('perfMaxLoad').value = c.max_load;
    if (c.max_mem_pct != null) $('perfMaxMem').value = c.max_mem_pct;
  } catch (e) { /* ignore */ }
}

async function savePerf() {
  const msg = $('perfMsg');
  msg.textContent = '保存中…';
  msg.style.color = 'var(--fg-2)';
  const body = {
    enabled: $('perfEnabled').checked,
    max_load: Number(v('perfMaxLoad')) || 0,
    max_mem_pct: Number(v('perfMaxMem')) || 0
  };
  try {
    const r = await api('/api/setting/perf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const d = await r.json().catch(() => ({}));
    if (r.ok) {
      msg.textContent = '已保存';
      msg.style.color = 'var(--success)';
    } else {
      msg.textContent = '保存失败：' + (d.error || d.message || r.status);
      msg.style.color = 'var(--danger)';
    }
  } catch (e) {
    msg.textContent = '请求失败';
    msg.style.color = 'var(--danger)';
  }
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadAll();
})();
</script>
</body>
</html>
