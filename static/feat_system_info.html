<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统信息</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>系统信息</h2>
    <div>
      <button class="btn btn-primary" onclick="loadAll()">刷新</button>
    </div>
  </div>

  <div class="stat-cards">
    <div class="stat-card"><div class="stat-title">状态</div><div class="stat-value" id="siStatus">—</div></div>
    <div class="stat-card"><div class="stat-title">版本</div><div class="stat-value" id="siVersion">—</div></div>
    <div class="stat-card"><div class="stat-title">请求总数</div><div class="stat-value" id="siTotalReq">—</div></div>
    <div class="stat-card"><div class="stat-title">今日请求</div><div class="stat-value" id="siTodayReq">—</div></div>
    <div class="stat-card"><div class="stat-title">收入</div><div class="stat-value" id="siRevenue">—</div></div>
    <div class="stat-card"><div class="stat-title">活跃用户</div><div class="stat-value" id="siActive">—</div></div>
    <div class="stat-card"><div class="stat-title">新用户</div><div class="stat-value" id="siNew">—</div></div>
    <div class="stat-card"><div class="stat-title">Goroutines</div><div class="stat-value" id="siGor">—</div></div>
  </div>

  <div class="card">
    <h3>健康检查 /healthz</h3>
    <pre class="preview" id="healthBody">加载中…</pre>
  </div>
</div>

<script>
const VERSION = '0.0.1.3';

async function loadHealth() {
  const el = $('healthBody');
  try {
    const r = await fetch('/healthz');
    const t = await r.text();
    el.textContent = t || ('HTTP ' + r.status);
    $('siStatus').textContent = r.ok ? '正常' : '异常';
  } catch (e) {
    el.textContent = 'healthz 请求失败：' + e;
    $('siStatus').textContent = '异常';
  }
}

async function loadMetrics() {
  try {
    const r = await fetch('/metrics');
    const t = await r.text();
    const m = t.match(/^go_goroutines\s+(\d+)/m);
    $('siGor').textContent = m ? m[1] : '—';
  } catch (e) {
    $('siGor').textContent = '—';
  }
}

async function loadStats() {
  try {
    const r = await api('/api/stats');
    if (!r.ok) return;
    const d = await r.json();
    $('siTotalReq').textContent = Number(d.total_requests || 0).toLocaleString();
    $('siTodayReq').textContent = Number(d.today_requests || 0).toLocaleString();
    const ops = d.ops || {};
    $('siRevenue').textContent = Number(ops.revenue || 0).toLocaleString();
    $('siActive').textContent = ops.active_users != null ? Number(ops.active_users).toLocaleString() : '—';
    $('siNew').textContent = ops.new_users != null ? Number(ops.new_users).toLocaleString() : '—';
  } catch (e) { /* ignore */ }
}

function loadAll() {
  $('siVersion').textContent = VERSION;
  loadHealth();
  loadMetrics();
  loadStats();
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
  loadAll();
})();
</script>
</body>
</html>
