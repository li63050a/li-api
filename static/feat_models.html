<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型管理</title>
<link rel="stylesheet" href="/common.css">
<script src="/common.js"></script>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>模型管理</h2>
  </div>
  <div class="tabs" id="modelTabs">
    <button class="tab active" data-page="feat_model_pricing" onclick="switchTab('feat_model_pricing',this)">模型定价</button>
    <button class="tab" data-page="feat_aliases" onclick="switchTab('feat_aliases',this)">模型别名</button>
    <button class="tab" data-page="feat_vmodels" onclick="switchTab('feat_vmodels',this)">虚拟模型</button>
    <button class="tab" data-page="feat_models_add" onclick="switchTab('feat_models_add',this)">添加模型</button>
  </div>
  <div class="tab-body">
    <iframe id="tabFrame" name="modelTabFrame"></iframe>
  </div>
</div>
<script>
// 切换内嵌标签页；供子页面（如 feat_models_add 的「返回」按钮）通过 window.parent.switchTab 调用
function switchTab(page, el){
  if(!el) el = document.querySelector('#modelTabs .tab[data-page="'+page+'"]');
  if(!el) return;
  document.querySelectorAll('#modelTabs .tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  document.getElementById('tabFrame').src = '/' + page + '.html';
  notifyHeight();
}

// 子 iframe 上报高度后同步并向上转发
window.addEventListener('message', function(ev){
  const d = ev.data || {};
  if(d && d.type === 'gw_frame_height' && d.height){
    const f = document.getElementById('tabFrame');
    if(f) f.style.height = (Number(d.height) + 4) + 'px';
    notifyHeight();
  }
});
document.getElementById('tabFrame').addEventListener('load', function(){
  notifyHeight();
});

switchTab('feat_model_pricing');
</script>
</body>
</html>
