<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天</title>
  <link rel="stylesheet" href="/common.css">
  <script src="/common.js"></script>
  <style>
    .chat-line { margin-bottom: 12px; }
    .chat-label { font-size: 12px; color: var(--fg-2); margin-bottom: 2px; }
    .chat-bubble {
      display: inline-block; padding: 8px 12px; border-radius: 8px;
      white-space: pre-wrap; word-break: break-all; max-width: 100%;
    }
    .chat-user { background: var(--primary-bg); color: var(--fg); }
    .chat-assistant { background: var(--th-bg); color: var(--fg); }
    .resp {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px; background: var(--code-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-all;
      max-height: 480px; overflow: auto;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <h2>聊天</h2>
  </div>

  <div class="card">
    <div class="form-group">
      <input id="model" placeholder="模型名称 model">
    </div>
    <div class="form-group">
      <textarea id="messages" rows="4" placeholder="输入消息，每行一条 user 消息"></textarea>
    </div>
    <div class="form-group">
      <button class="btn btn-primary" onclick="sendChat()">发送</button>
      <span id="msg" class="msg"></span>
    </div>
  </div>

  <div class="card">
    <h3>对话</h3>
    <div id="conv" class="muted">尚未发送请求。</div>
  </div>
</div>

<script>
function extractContent(d) {
  if (d && Array.isArray(d.choices) && d.choices[0] &&
      d.choices[0].message && d.choices[0].message.content) {
    return d.choices[0].message.content;
  }
  return null;
}

async function sendChat() {
  const msg = $('msg');
  const conv = $('conv');
  msg.textContent = '';
  const model = v('model').trim();
  if (!model) { msg.textContent = '请填写模型名称'; return; }
  const text = v('messages');
  const messages = text.split('\n').map(s => s.trim()).filter(Boolean)
    .map(content => ({ role: 'user', content: content }));
  if (messages.length === 0) { msg.textContent = '请输入至少一条消息'; return; }

  const old = conv.innerHTML === '尚未发送请求。' ? '' : conv.innerHTML;
  const newBubbles = messages.map(m =>
    '<div class="chat-line"><div class="chat-label">用户</div><div class="chat-bubble chat-user">' + escapeHtml(m.content) + '</div></div>'
  ).join('') + '<div class="chat-line"><div class="chat-label">助手</div><div class="chat-bubble chat-assistant" id="assistBox">回复中…</div></div>';
  conv.innerHTML = old + newBubbles;
  conv.classList.remove('muted');

  try {
    const r = await api('/api/test_chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: model, messages: messages })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      $('assistBox').textContent = JSON.stringify({ error: d.error || d.message || ('HTTP ' + r.status) }, null, 2);
      msg.textContent = '请求失败（' + r.status + '）';
      return;
    }
    const content = extractContent(d);
    $('assistBox').textContent = content != null ? content : JSON.stringify(d, null, 2);
  } catch (e) {
    $('assistBox').textContent = '请求出错：' + e;
    msg.textContent = '请求出错';
  }
}

(async () => {
  try { await ensureAuth(); } catch (e) { return; }
})();
</script>
</body>
</html>
