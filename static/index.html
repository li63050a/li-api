<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 网关管理控制台</title>
    <link rel="stylesheet" href="/common.css">
    <style>
        body { padding: 0; }
        .login-wrap { min-height: 100vh; }
    </style>
</head>
<body>
    <!-- 登录/注册 -->
    <div id="auth" class="login-wrap">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-logo">API</div>
                <div>
                    <div class="login-title">API 网关</div>
                    <div class="login-sub">管理控制台</div>
                </div>
            </div>
            <div class="form-group">
                <input id="u" placeholder="用户名" />
            </div>
            <div class="form-group">
                <input id="p" type="password" placeholder="密码" />
            </div>
            <div class="login-btns">
                <button class="btn btn-primary" onclick="login()">登录</button>
                <button class="btn btn-default" onclick="register()">注册</button>
            </div>
            <p id="authMsg" class="msg" style="margin:12px 0 0"></p>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="app" class="layout" style="display:none">
        <!-- 左侧边栏 -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">API</div>
                <div>
                    <div class="brand-name">API 网关</div>
                    <div class="brand-sub">管理控制台</div>
                </div>
            </div>
            <nav class="menu" id="menu">
                <div class="menu-group">首页</div>
                <a class="menu-item" href="#" data-page="feat_usage" onclick="return nav('feat_usage','控制台',this)"><span class="mi">⌂</span>控制台</a>

                <div class="menu-group">令牌</div>
                <a class="menu-item" href="#" data-page="feat_tokens" data-root="1" onclick="return nav('feat_tokens','令牌管理',this)"><span class="mi">⬡</span>令牌管理</a>
                <a class="menu-item" href="#" data-page="feat_batchtoken" data-root="1" onclick="return nav('feat_batchtoken','批量令牌',this)"><span class="mi">▤</span>批量令牌</a>

                <div class="menu-group">渠道</div>
                <a class="menu-item" href="#" data-page="feat_channels" data-root="1" onclick="return nav('feat_channels','渠道管理',this)"><span class="mi">⇄</span>渠道管理</a>
                <a class="menu-item" href="#" data-page="feat_channelhealth" data-root="1" onclick="return nav('feat_channelhealth','渠道健康',this)"><span class="mi">♥</span>渠道健康</a>

                <div class="menu-group">日志</div>
                <a class="menu-item" href="#" data-page="feat_logs" data-root="1" onclick="return nav('feat_logs','请求日志',this)"><span class="mi">☰</span>请求日志</a>
                <a class="menu-item" href="#" data-page="feat_audit" data-root="1" onclick="return nav('feat_audit','审计日志',this)"><span class="mi">☷</span>审计日志</a>

                <div class="menu-group">消费</div>
                <a class="menu-item" href="#" data-page="feat_stats" data-root="1" onclick="return nav('feat_stats','消费统计',this)"><span class="mi">⌁</span>消费统计</a>
                <a class="menu-item" href="#" data-page="feat_cost" data-root="1" onclick="return nav('feat_cost','费用明细',this)"><span class="mi">≌</span>费用明细</a>
                <a class="menu-item" href="#" data-page="feat_invoice" data-root="1" onclick="return nav('feat_invoice','发票管理',this)"><span class="mi">⌸</span>发票管理</a>

                <div class="menu-group">用户</div>
                <a class="menu-item" href="#" data-page="feat_users" data-root="1" onclick="return nav('feat_users','用户管理',this)"><span class="mi">◉</span>用户管理</a>
                <a class="menu-item" href="#" data-page="feat_billing" onclick="return nav('feat_billing','充值/兑换码',this)"><span class="mi">⟳</span>充值/兑换码</a>
                <a class="menu-item" href="#" data-page="feat_team" data-root="1" onclick="return nav('feat_team','邀请/团队',this)"><span class="mi">➤</span>邀请/团队</a>

                <div class="menu-group">模型</div>
                <a class="menu-item" href="#" data-page="feat_models" data-root="1" onclick="return nav('feat_models','模型价格',this)"><span class="mi">♢</span>模型价格</a>
                <a class="menu-item" href="#" data-page="feat_groups" data-root="1" onclick="return nav('feat_groups','分组',this)"><span class="mi">▦</span>分组</a>
                <a class="menu-item" href="#" data-page="feat_aliases" data-root="1" onclick="return nav('feat_aliases','模型别名',this)"><span class="mi">⧉</span>模型别名</a>
                <a class="menu-item" href="#" data-page="feat_testchat" onclick="return nav('feat_testchat','模型测试',this)"><span class="mi">✎</span>模型测试</a>

                <div class="menu-group">设置</div>
                <a class="menu-item" href="#" data-page="feat_security" onclick="return nav('feat_security','OAuth/安全',this)"><span class="mi">❖</span>OAuth/安全</a>
                <a class="menu-item" href="#" data-page="feat_notify" data-root="1" onclick="return nav('feat_notify','通知',this)"><span class="mi">≔</span>通知</a>
                <a class="menu-item" href="#" data-page="feat_site" data-root="1" onclick="return nav('feat_site','系统设置',this)"><span class="mi">⚙</span>系统设置</a>
                <a class="menu-item" href="#" data-page="console" onclick="return nav('console','个人中心',this)"><span class="mi">☺</span>个人中心</a>
                <a class="menu-item" href="#" data-page="feat_routes" data-root="1" onclick="return nav('feat_routes','路由(旧)',this)"><span class="mi">⌘</span>路由(旧)</a>
                <a class="menu-item" href="#" data-page="feat_about" onclick="return nav('feat_about','关于',this)"><span class="mi">ℹ</span>关于</a>
            </nav>
        </aside>

        <!-- 右侧主区域 -->
        <div class="main">
            <header class="header">
                <div class="page-title" id="pageTitle">控制台</div>
                <div class="header-right">
                    <div class="user-chip" title="当前用户">
                        <span class="user-avatar" id="avatar"></span>
                        <span class="user-name" id="who"></span>
                        <span class="role-tag" id="roleTag"></span>
                    </div>
                    <button class="btn btn-default" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
                    <button class="btn btn-danger" onclick="logout()">退出</button>
                </div>
            </header>
            <main class="content">
                <iframe id="frame" name="gwframe" style="height:600px"></iframe>
            </main>
        </div>
    </div>

<script>
    const TOKEN_KEY = 'gw_token';
    function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
    function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

    // 统一带鉴权的请求
    async function api(path, opts={}) {
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + getToken();
        return fetch(path, opts);
    }
    function v(id){ return document.getElementById(id).value; }

    async function login(){
        const r = await fetch('/api/user/login', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username:v('u'), password:v('p')})});
        if(!r.ok){ document.getElementById('authMsg').textContent='登录失败'; return; }
        const d = await r.json(); setToken(d.token); enterApp();
    }
    async function register(){
        const r = await fetch('/api/user/register', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username:v('u'), password:v('p')})});
        if(!r.ok){ document.getElementById('authMsg').textContent='注册失败：'+(await r.text()); return; }
        const d = await r.json(); setToken(d.token); enterApp();
    }
    function logout(){ clearToken(); location.reload(); }

    async function enterApp(){
        const r = await api('/api/user/self');
        if(!r.ok){ clearToken(); location.reload(); return; }
        const d = await r.json();
        document.getElementById('auth').style.display='none';
        document.getElementById('app').style.display='flex';
        const isRoot = d.role === 'root';
        document.getElementById('who').textContent = d.username;
        document.getElementById('avatar').textContent = (d.username || '?').slice(0, 1).toUpperCase();
        const tag = document.getElementById('roleTag');
        tag.textContent = isRoot ? '管理员' : '用户';
        tag.classList.toggle('role-tag-user', !isRoot);
        if(!isRoot){
            document.querySelectorAll('#menu .menu-item[data-root]').forEach(el=>el.style.display='none');
        }
        // 默认进入控制台
        document.querySelectorAll('#menu .menu-item').forEach(a=>a.classList.remove('active'));
        const first = document.querySelector('#menu .menu-item[data-page="feat_usage"]');
        if(first) first.classList.add('active');
        loadExt('feat_usage', '控制台');
    }
    if(getToken()) enterApp();

    function toggleTheme(){
        const dark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('gw_theme', dark ? 'dark' : 'light');
        document.getElementById('themeBtn').textContent = dark ? '☀' : '🌙';
        applyThemeToFrame();
    }
    if(localStorage.getItem('gw_theme') === 'dark'){
        document.documentElement.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀';
    }
    // 同步主题到 iframe（同源页面）
    function applyThemeToFrame(){
        const f = document.getElementById('frame');
        try {
            if(f && f.contentDocument && f.contentDocument.documentElement){
                const dark = document.documentElement.classList.contains('dark');
                f.contentDocument.documentElement.classList.toggle('dark', dark);
            }
        } catch(e){}
    }

    // 导航：切换 iframe 页面并高亮菜单
    function nav(page, title, el){
        if(el){
            document.querySelectorAll('#menu .menu-item').forEach(a=>a.classList.remove('active'));
            el.classList.add('active');
        }
        document.getElementById('pageTitle').textContent = title;
        loadExt(page);
        return false;
    }
    function loadExt(name){
        const f = document.getElementById('frame');
        f.style.height = '600px';
        f.src = '/' + name + '.html';
    }

    // iframe 高度自适应（同源直接测量；子页面也通过 postMessage 上报）
    function fitFrame(){
        const f = document.getElementById('frame');
        if(!f || !f.contentDocument) return;
        const doc = f.contentDocument;
        let h = 0;
        if(doc.body) h = Math.max(h, doc.body.scrollHeight);
        if(doc.documentElement) h = Math.max(h, doc.documentElement.scrollHeight);
        if(h > 0) f.style.height = (h + 4) + 'px';
    }
    function onFrameLoad(){
        applyThemeToFrame();
        fitFrame();
    }
    window.addEventListener('message', function(ev){
        const d = ev.data || {};
        if(d && d.type === 'gw_frame_height' && d.height){
            const f = document.getElementById('frame');
            if(f) f.style.height = (Number(d.height) + 4) + 'px';
        }
    });
    window.addEventListener('resize', function(){ setTimeout(fitFrame, 60); });
    document.getElementById('frame').addEventListener('load', onFrameLoad);
</script>
<script>
(function loadAnnouncement() {
    if (sessionStorage.getItem('announce_dismissed') === '1') return;
    fetch('/api/announcement')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
            if (!d || !d.announcement) return;
            var bar = document.createElement('div');
            bar.className = 'announce-bar';
            bar.textContent = String(d.announcement);
            var close = document.createElement('button');
            close.className = 'announce-close';
            close.textContent = '×';
            close.title = '关闭';
            close.onclick = function () {
                sessionStorage.setItem('announce_dismissed', '1');
                bar.remove();
            };
            bar.appendChild(close);
            var app = document.getElementById('app');
            if (app) {
                var content = app.querySelector('.content');
                if (content) content.insertBefore(bar, content.firstChild);
            }
        })
        .catch(function () {});
})();
</script>
</body>
</html>
