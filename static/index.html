        <!-- 右侧主区域 -->
        <div class="main">
            <header class="header">
                <div class="header-left">
                    <button class="btn btn-default sidebar-toggle" id="sideToggle" onclick="toggleSidebar()" title="折叠 / 展开侧边栏">☰</button>
                    <div class="header-brand">
                        <div class="brand-logo">API</div>
                        <span class="brand-name">API 网关</span>
                    </div>
                    <div class="header-divider"></div>
                    <div class="page-title" id="pageTitle">仪表盘</div>
                </div>
                <div class="header-right">
                    <button class="btn btn-default" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
                    <div class="user-menu" id="userMenu">
                        <button class="user-chip" onclick="toggleUserMenu()" title="账户菜单">
                            <span class="user-avatar" id="avatar"></span>
                            <span class="user-name" id="who"></span>
                            <span class="role-tag" id="roleTag"></span>
                            <span class="caret">▾</span>
                        </button>
                        <div class="user-dropdown" id="userDropdown">
                            <a class="dropdown-item" href="#" onclick="closeUserMenu(); return nav('console','个人中心',document.querySelector('#menu .menu-item[data-page=console]'))">个人中心</a>

                            <a class="dropdown-item danger" href="#" onclick="logout()">退出登录</a>

                    </div>

            <main class="content">
                <iframe id="frame" name="gwframe" style="height:600px"></iframe>
            </main>

<script>
    const TOKEN_KEY = 'gw_token';
    function getToken(){ return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
    function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

    // 统一带鉴权的请求
    async function api(path, opts={}) {
        opts.headers = opts.headers || {};
        opts.headers['Authorization'] = 'Bearer ' + getToken();
        return fetch(path, opts);
    }
    function v(id){ return document.getElementById(id).value; }

    async function login(){
        const r = await fetch('/api/user/login', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username:v('u'), password:v('p')})});
        if(!r.ok){ document.getElementById('authMsg').textContent='登录失败'; return; }
        const d = await r.json(); setToken(d.token); enterApp();
    }
    async function register(){
        const r = await fetch('/api/user/register', {method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({username:v('u'), password:v('p')})});
        if(!r.ok){ document.getElementById('authMsg').textContent='注册失败：'+(await r.text()); return; }
        const d = await r.json(); setToken(d.token); enterApp();
    }
    function logout(){ clearToken(); location.reload(); }

    // 侧边栏折叠（icon-only rail，持久化）
    function toggleSidebar(){
        const app = document.getElementById('app');
        app.classList.toggle('collapsed');
        localStorage.setItem('gw_sidebar', app.classList.contains('collapsed') ? '1' : '0');
        setTimeout(fitFrame, 240);
    }
    function toggleSub(el){
        const app = document.getElementById('app');
        if(app.classList.contains('collapsed')){
            app.classList.remove('collapsed');
            localStorage.setItem('gw_sidebar', '0');
        }
        el.parentElement.classList.toggle('open');
        return false;
    }

    // 用户菜单
    function toggleUserMenu(){
        document.getElementById('userMenu').classList.toggle('open');
    }
    function closeUserMenu(){
        document.getElementById('userMenu').classList.remove('open');
    }
    document.addEventListener('click', function(ev){
        const m = document.getElementById('userMenu');
        if(m && !m.contains(ev.target)) m.classList.remove('open');
    });

    async function enterApp(){
        const r = await api('/api/user/self');
        if(!r.ok){ clearToken(); location.reload(); return; }
        const d = await r.json();
        document.getElementById('auth').style.display='none';
        document.getElementById('app').style.display='flex';
        const isRoot = d.role === 'root';
        document.getElementById('who').textContent = d.username;
        document.getElementById('avatar').textContent = (d.username || '?').slice(0, 1).toUpperCase();
        const tag = document.getElementById('roleTag');
        tag.textContent = isRoot ? '管理员' : '用户';
        tag.classList.toggle('role-tag-user', !isRoot);
        if(!isRoot){
            document.querySelectorAll('#menu .menu-item[data-root]').forEach(el=>el.style.display='none');
            // 隐藏无可见子项的子菜单
            document.querySelectorAll('#menu .menu-sub').forEach(ms=>{
                let any = false;
                ms.querySelectorAll('.submenu .menu-item').forEach(a=>{ if(a.style.display !== 'none') any = true; });
                if(!any) ms.style.display = 'none';
            });
        }
        // 恢复折叠状态
        if(localStorage.getItem('gw_sidebar') === '1'){
            document.getElementById('app').classList.add('collapsed');
        }
        // 默认进入仪表盘
        document.querySelectorAll('#menu .menu-item').forEach(a=>a.classList.remove('active'));
        const first = document.querySelector('#menu .menu-item[data-page="feat_usage"]');
        if(first) first.classList.add('active');
        loadExt('feat_usage', '仪表盘');
    }
    if(getToken()) enterApp();

    function toggleTheme(){
        const dark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('gw_theme', dark ? 'dark' : 'light');
        document.getElementById('themeBtn').textContent = dark ? '☀' : '🌙';
        applyThemeToFrame();
    }
    if(localStorage.getItem('gw_theme') === 'dark'){
        document.documentElement.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀';
    }
    // 同步主题到 iframe（同源页面）
    function applyThemeToFrame(){
        const f = document.getElementById('frame');
        try {
            if(f && f.contentDocument && f.contentDocument.documentElement){
                const dark = document.documentElement.classList.contains('dark');
                f.contentDocument.documentElement.classList.toggle('dark', dark);
            }
        } catch(e){}
    }

    // 导航：切换 iframe 页面并高亮菜单
    function nav(page, title, el){
        document.querySelectorAll('#menu .menu-item').forEach(a=>a.classList.remove('active'));
        if(el){
            el.classList.add('active');
            // 若位于子菜单内则展开所属子菜单
            const ms = el.closest('.menu-sub');
            if(ms) ms.classList.add('open');
        }
        document.getElementById('pageTitle').textContent = title;
        loadExt(page);
        return false;
    }
    function loadExt(name){
        const f = document.getElementById('frame');
        f.style.height = '600px';
        f.src = '/' + name + '.html';
    }

    // iframe 高度自适应（同源直接测量；子页面也通过 postMessage 上报）
    function fitFrame(){
        const f = document.getElementById('frame');
        if(!f || !f.contentDocument) return;
        const doc = f.contentDocument;
        let h = 0;
        if(doc.body) h = Math.max(h, doc.body.scrollHeight);
        if(doc.documentElement) h = Math.max(h, doc.documentElement.scrollHeight);
        if(h > 0) f.style.height = (h + 4) + 'px';
    }
    function onFrameLoad(){
        applyThemeToFrame();
        fitFrame();
    }
    window.addEventListener('message', function(ev){
        const d = ev.data || {};
        if(d && d.type === 'gw_frame_height' && d.height){
            const f = document.getElementById('frame');
            if(f) f.style.height = (Number(d.height) + 4) + 'px';
        }
    });
    window.addEventListener('resize', function(){ setTimeout(fitFrame, 60); });
    document.getElementById('frame').addEventListener('load', onFrameLoad);
</script>
<script>
(function loadAnnouncement() {
    if (sessionStorage.getItem('announce_dismissed') === '1') return;
    fetch('/api/announcement')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
            if (!d || !d.announcement) return;
            var bar = document.createElement('div');
            bar.className = 'announce-bar';
            bar.textContent = String(d.announcement);
            var close = document.createElement('button');
            close.className = 'announce-close';
            close.textContent = '×';
            close.title = '关闭';
            close.onclick = function () {
                sessionStorage.setItem('announce_dismissed', '1');
                bar.remove();
            };
            bar.appendChild(close);
            var app = document.getElementById('app');
            if (app) {
                var content = app.querySelector('.content');
                if (content) content.insertBefore(bar, content.firstChild);
            }
        })
        .catch(function () {});
})();
</script>
